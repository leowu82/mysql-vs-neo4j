<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1680" viewBox="0 0 2200 1680" role="img" aria-labelledby="title description">
<title id="title">Catalog entity relationship diagram</title>
<desc id="description">All sixteen catalog tables in one connected ER diagram. Resource is the central entity, with junction tables and lookups to the left, citations to the right, source notes above, and resource relationships below. Supporting citation foreign keys are listed in the tables without extra connectors.</desc>
